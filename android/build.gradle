// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    // OPTIMIZATION: Use Android Gradle Plugin 8.5.0 (compatible with Kotlin 1.9.0 Expo plugins)
    classpath('com.android.tools.build:gradle:8.5.0')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

def reactNativeAndroidDir = new File(
  providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('react-native/package.json')")
  }.standardOutput.asText.get().trim(),
  "../android"
)

allprojects {
  repositories {
    maven {
      // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
      url(reactNativeAndroidDir)
    }

    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

// Library modules that don't declare an NDK (e.g. @sentry/react-native) fall back to the
// Android Gradle Plugin's default NDK, which triggers a separate ~1 GB NDK download.
// Point them at the NDK the app already uses (android.ndkVersion in gradle.properties).
subprojects { subproject ->
  subproject.plugins.withId('com.android.library') {
    subproject.android.ndkVersion = rootProject.ext.has('ndkVersion') ? rootProject.ext.ndkVersion : '27.1.12297006'
  }
}
